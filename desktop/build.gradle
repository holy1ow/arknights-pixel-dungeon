plugins {
    id 'org.beryx.runtime' version '2.0.1'
}

[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility

ext.appMainClass = "com.shatteredpixel.shatteredpixeldungeon.desktop.DesktopLauncher"
application.mainClass = appMainClass
processResources {
    from new File(project(':core').projectDir, "/src/main/assets")
    from new File(project(':desktop').projectDir,"/src/main/assets")
    from rootProject.file('LICENSE.txt')
    from(rootProject.projectDir) { include 'NOTICE.md', 'THIRD-PARTY-NOTICES.md', 'MODIFICATIONS.md' }
    from(rootProject.file('licenses')) { into 'licenses' }
}

def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)

tasks.register('debug', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    ignoreExitValue = true

    mainClass = appMainClass
    systemProperty 'Specification-Title', appName
    systemProperty 'Implementation-Title', appPackageName
    systemProperty 'Specification-Version', appVersionName + "-INDEV"
    systemProperty 'Implementation-Version', appVersionCode

    if (osName.contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
}

// Both the application distribution and the standalone JAR need this metadata.
tasks.withType(Jar).configureEach {
    manifest {
        attributes 'Main-Class': appMainClass
        attributes 'Specification-Title': appName
        attributes 'Implementation-Title': appPackageName
        attributes 'Specification-Version': appVersionName
        attributes 'Implementation-Version': appVersionCode
    }
}

tasks.register('release', Jar) {
    // Keep the standalone bundle separate from the application's normal JAR.
    archiveClassifier = 'all'
    //FIXME this is now needed as of gradle 7.0, due to our weird sourceSets setup. Should see if there's a better way to do this
    setDuplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from { configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) } }

}

def verifyDesktopArchives = tasks.register('verifyDesktopArchives') {
    dependsOn tasks.named('jar'), tasks.named('release')
    doLast {
        def archives = ['jar', 'release'].collect { tasks.named(it, Jar).get().archiveFile.get().asFile }
        if (archives[0].canonicalPath == archives[1].canonicalPath) {
            throw new GradleException('Desktop jar and release tasks must have different output files.')
        }
        def expected = [
            'Main-Class': appMainClass,
            'Specification-Title': appName,
            'Implementation-Title': appPackageName,
            'Specification-Version': appVersionName,
            'Implementation-Version': appVersionCode.toString()
        ]
        archives.each { archive ->
            new java.util.jar.JarFile(archive).withCloseable { jarFile ->
                expected.each { key, value ->
                    if (jarFile.manifest?.mainAttributes?.getValue(key) != value) {
                        throw new GradleException("${archive.name}: missing or incorrect ${key}")
                    }
                }
            }
        }
    }
}
tasks.named('check') { dependsOn verifyDesktopArchives }

tasks.register('verifyHeroClasses', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.desktop.HeroClassChecks'
    def scratch = layout.buildDirectory.dir('hero-class-qa')
    doFirst { scratch.get().asFile.mkdirs() }
    args scratch.get().asFile.absolutePath
}
tasks.named('check') { dependsOn tasks.named('verifyHeroClasses') }

// Desktop checks are executable Java main classes, not JUnit tests. Keep those
// checks attached above while allowing Gradle 9's empty JUnit discovery result.
tasks.named('test') { failOnNoDiscoveredTests = false }

tasks.register('verifyHeroSelection', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.desktop.HeroSelectionChecks'
    args layout.buildDirectory.dir('hero-class-qa').get().asFile.absolutePath,
            providers.gradleProperty('qaWidth').getOrElse('1280'),
            providers.gradleProperty('qaHeight').getOrElse('720'),
            providers.gradleProperty('qaLanguage').getOrElse('zh')
    if (osName.contains('mac')) jvmArgs '-XstartOnFirstThread'
}
tasks.named('jpackageImage') { dependsOn verifyDesktopArchives }

runtime {
    modules = ['java.base',
               'java.desktop',
               'jdk.unsupported',
               'jdk.crypto.cryptoki',
               'jdk.management']
    options = ['--strip-debug',
               '--compress', '2',
               '--no-header-files',
               '--no-man-pages',
               '--strip-native-commands',
               '--vm', 'server']

    jpackage {
        mainClass = appMainClass
        appVersion = (appVersionName =~ /\d+\.\d+\.\d+/)[0]
        imageName = appName
    }

    if (osName.contains('windows')) {
        //May work on Windows 7 (2009), but that's old enough that I'm only officially supporting Windows 10 (2015)
        targetPlatform("win") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_x64_windows_hotspot_17.0.17_10.zip")
            javaHome = file("./build/jdks/win/jdk-17.0.17+10").getAbsolutePath()
            jpackage {
                jpackageHome = file("./build/jdks/win/jdk-17.0.17+10")
                imageOptions = ["--icon", file("./src/main/assets/icons/windows.ico"),
                                "--java-options", "-XX:+IgnoreUnrecognizedVMOptions"]
            }
        }
    } else if (osName.contains('linux')) {
        //May work on glibc 2.12 (2010), but that's old enough that I'm only officially supporting glibc 2.17 (2012)
        targetPlatform("linux") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_x64_linux_hotspot_17.0.17_10.tar.gz")
            javaHome = file("./build/jdks/linux/jdk-17.0.17+10").getAbsolutePath()
            jpackage {
                jpackageHome = file("./build/jdks/linux/jdk-17.0.17+10")
                imageOptions = ["--icon", file("./src/main/assets/icons/icon_256.png"),
                                "--java-options", "-XX:+IgnoreUnrecognizedVMOptions"]
            }
        }
    } else if (osName.contains('mac')) {
        //This JDK officially supports MacOS 12 (2021), but internals suggest support for 10.12 (2016)
        targetPlatform("mac") {
            jdkHome = jdkDownload("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.17%2B10/OpenJDK17U-jdk_x64_mac_hotspot_17.0.17_10.tar.gz")
            javaHome = file("./build/jdks/mac/jdk-17.0.17+10/Contents/Home/").getAbsolutePath()
            jpackage {
                jpackageHome = file("./build/jdks/mac/jdk-17.0.17+10/Contents/Home/")
                imageOptions = ["--icon", file("./src/main/assets/icons/mac.icns"),
                                "--java-options", "-XstartOnFirstThread",
                                "--java-options", "-XX:+IgnoreUnrecognizedVMOptions",
                                //append .apple because com.shatteredpixel.shatteredpixeldungeon was taken =(
                                "--mac-package-identifier", appPackageName + ".apple"]
            }
        }
    }

}

dependencies {
    implementation project(':core')

    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:$gdxControllersVersion"

    //we use LWJGL tinyFD directly to display crash messages
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-windows"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-macos"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-macos-arm64"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-linux"
    implementation "org.lwjgl:lwjgl-tinyfd:3.3.3:natives-linux-arm64"

    implementation project(':services:updates:offlineUpdates')
    implementation project(':services:news:offlineNews')
}



tasks.register('verifyOperatorRuntime', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.desktop.OperatorRuntimeChecks'
    args layout.buildDirectory.dir('arknights-integration-qa/runtime').get().asFile.absolutePath
}

tasks.register('verifyPackagedOperators', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('release')
    classpath = files(tasks.named('release', Jar).flatMap { it.archiveFile }) + sourceSets.test.output
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.desktop.OperatorRuntimeChecks'
    args layout.buildDirectory.dir('arknights-integration-qa/packaged-runtime').get().asFile.absolutePath
}

tasks.register('verifyOperatorCanvas', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('release')
    classpath = files(tasks.named('release', Jar).flatMap { it.archiveFile }) + sourceSets.test.output
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.desktop.OperatorCanvasChecks'
    args layout.buildDirectory.dir('release-0.0.2-qa/canvas').get().asFile.absolutePath,
            providers.gradleProperty('canvasMode').getOrElse('after')
}

tasks.register('verifyAmiyaEffects', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('release')
    classpath = files(tasks.named('release', Jar).flatMap { it.archiveFile }) + sourceSets.test.output
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.desktop.AmiyaEffectChecks'
    args layout.buildDirectory.dir('release-0.0.2-qa/effects').get().asFile.absolutePath
}
